<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechEd | IT Learning Platform (Cloud Sync)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #030712; color: #f3f4f6; }
        .view-section { display: none; }
        .view-section.active { display: block; }
    </style>
</head>
<body class="min-h-screen">
    <header class="border-b border-gray-800 p-4 flex justify-between items-center">
        <div class="font-bold text-xl text-white">Tech<span class="text-cyan-400">Ed</span></div>
        <div class="space-x-4">
            <button onclick="window.switchRole('admin')" class="text-cyan-400">Админ</button>
            <button onclick="window.switchRole('student')" class="text-gray-400">Ученик</button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-6">
        <!-- АДМИН ПАНЕЛЬ -->
        <section id="view-admin" class="view-section active">
            <h1 class="text-2xl font-bold mb-6">Создать курс</h1>
            <input type="text" id="course-title" placeholder="Название курса" class="w-full bg-gray-900 border border-gray-700 p-3 rounded-lg mb-4 text-white">
            <div id="blocks-container" class="space-y-4 mb-4"></div>
            <button onclick="window.addBlock()" class="text-cyan-400">+ Добавить блок с видео</button>
            <button onclick="window.publishCourse()" class="block w-full bg-cyan-500 text-gray-900 font-bold py-3 rounded-lg mt-6">Опубликовать курс</button>
        </section>

        <!-- СТУДЕНТ ПАНЕЛЬ -->
        <section id="view-student" class="view-section">
            <h1 class="text-2xl font-bold mb-6">Ваши курсы</h1>
            <div id="student-courses" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAHWDiuc9DGawTvbmCwmCg6JbKnwiOE53c",
            projectId: "teched-platform"
        };

        const db = getFirestore(initializeApp(firebaseConfig));

        // Автоматическое обновление списка курсов для ученика
        onSnapshot(collection(db, 'courses'), (snapshot) => {
            const container = document.getElementById('student-courses');
            container.innerHTML = '';
            snapshot.forEach((doc) => {
                const data = doc.data();
                // Добавлена безопасная проверка: если blocks нет, используем 0
                const blocksCount = (data.blocks && Array.isArray(data.blocks)) ? data.blocks.length : 0;
                
                container.innerHTML += `
                    <div class="bg-gray-800 p-6 rounded-xl border border-gray-700">
                        <h3 class="text-xl font-bold mb-2">${data.title || 'Без названия'}</h3>
                        <p class="text-gray-400 mb-4">Модулей: ${blocksCount}</p>
                        <button class="text-cyan-400 underline">Начать обучение</button>
                    </div>
                `;
            });
        });

        window.addBlock = () => {
            document.getElementById('blocks-container').insertAdjacentHTML('beforeend', `
                <div class="bg-gray-800 p-4 rounded-lg border border-gray-700 block-item space-y-2">
                    <input type="text" placeholder="Название темы" class="w-full bg-transparent border-b border-gray-600 outline-none text-white block-title">
                    <input type="text" placeholder="Ссылка на YouTube" class="w-full bg-transparent border-b border-gray-600 outline-none text-cyan-300 block-video text-sm">
                </div>
            `);
        };

        window.publishCourse = async () => {
            const blocks = Array.from(document.querySelectorAll('.block-item')).map(item => ({
                title: item.querySelector('.block-title').value,
                video: item.querySelector('.block-video').value
            }));
            
            await addDoc(collection(db, 'courses'), {
                title: document.getElementById('course-title').value,
                blocks: blocks
            });
            alert('Курс опубликован в облаке!');
        };

        window.switchRole = (role) => {
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
            document.getElementById('view-' + role).classList.add('active');
        };
    </script>
</body>
</html>
